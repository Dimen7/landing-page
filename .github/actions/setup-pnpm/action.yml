name: Setup pnpm
description: Put pnpm on PATH from its GitHub release, without going through npm.

inputs:
  version:
    description: pnpm version. Defaults to the `packageManager` field.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        version="${{ inputs.version }}"
        if [ -z "$version" ]; then
          version=$(sed -n 's/.*"packageManager": *"pnpm@\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/package.json")
        fi
        if [ -z "$version" ]; then
          echo "::error::Could not read the pnpm version from package.json"
          exit 1
        fi

        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  asset=pnpm-linux-x64 ;;
          Linux-aarch64) asset=pnpm-linux-arm64 ;;
          Darwin-arm64)  asset=pnpm-darwin-arm64 ;;
          *)
            echo "::error::pnpm publishes no release asset for $(uname -s)-$(uname -m)"
            exit 1
            ;;
        esac

        dest="$RUNNER_TEMP/pnpm-bin"
        mkdir -p "$dest"
        curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${version}/${asset}.tar.gz" \
          | tar -xz -C "$dest"
        chmod +x "$dest/pnpm"
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/pnpm" --version
